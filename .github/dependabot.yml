version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are reviewed as deliberate migrations. Keeping them out
      # of the weekly queue prevents runtime, tooling and UI versions from
      # drifting away from the versions validated in production.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/platform-fastify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/swagger"
        update-types: ["version-update:semver-major"]
      - dependency-name: bullmq
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: vinext
        # vinext 1.3 emits Cloudflare-only module URLs during SSR in the
        # current self-hosted Node runtime. Keep the validated beta until the
        # runtime migration is handled separately.
        versions: [">=1.0.0"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      - dependency-name: undici
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

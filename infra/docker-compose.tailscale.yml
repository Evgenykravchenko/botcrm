services:
  caddy:
    ports: !reset []
    volumes: !override
      - ./Caddyfile.tailscale:/etc/caddy/Caddyfile:ro

  tailscale:
    image: tailscale/tailscale:stable@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    hostname: ${TAILSCALE_HOSTNAME:-botcrm-rpi}
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-botcrm-rpi}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-serve:/config:ro
    depends_on:
      caddy: { condition: service_started }
      minio: { condition: service_started }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

volumes:
  tailscale_state:

name: botcrm
services:
  edge:
    image: caddy:2.10.2-alpine
    volumes:
      - ${BOTCRM_EDGE_DIR:-../.runtime/edge}:/etc/caddy:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      backend: {}
      content_platform:
        # Existing content bots keep their internal http://api:4100 address.
        aliases: [api]
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }
  api-gateway:
    image: caddy:2.10.2-alpine
    volumes:
      - ${BOTCRM_EDGE_DIR:-../.runtime/edge}/api-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      backend:
        aliases: [api]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4100/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }
networks:
  backend:
    external: true
    name: botcrm_backend
  content_platform:
    external: true
    name: ${CONTENT_PLATFORM_NETWORK:-bot_platform_backend}
